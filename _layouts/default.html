<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

  {% include head-custom.html %}
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.description }}</p>
      <a class="btn" href="https://github.com/TheBengineer" rel="noopener">GitHub</a>
    </div>
  </header>

  <main id="main" class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        © {{ site.time | date: '%Y' }} {{ site.title }} ·
        <a href="https://github.com/TheBengineer/TheBengineer.github.io">built with Jekyll</a>
        · served on <a href="https://pages.github.com/">GitHub Pages</a>
        &amp; <a href="https://www.netlify.com/">Netlify</a>.
      </p>
    </div>
  </footer>
</body>
</html>
